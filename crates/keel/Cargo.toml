[package]
name = "keel"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "Apache-2.0"
description = "Rust middleware for connecting applications to agent harnesses"

[lib]
path = "src/lib.rs"

[[bin]]
name = "keel"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
