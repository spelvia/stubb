[package]
name = "keel"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "MIT"
description = "Rust middleware for connecting applications to agent harnesses"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread"] }
