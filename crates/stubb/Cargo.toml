[package]
name = "stubb"
version = "0.1.1-rc.1"
edition = "2024"
rust-version = "1.99.0"
license = "MIT"
repository = "https://github.com/spelvia/stubb"
readme = "../../README.md"
description = "A Rust library for embedding coding agents (Codex, Claude Code, Pi, and ACP agents) in your application"
keywords = ["agent", "codex", "claude", "acp", "llm"]
categories = ["api-bindings", "development-tools"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
path = "src/lib.rs"

[features]
default = ["claude", "codex", "pi", "acp"]
claude = []
codex = []
pi = []
acp = ["dep:agent-client-protocol"]

[dependencies]
agent-client-protocol = { version = "5.3.0", optional = true }
base64 = "0.23"
futures = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread"] }

[[example]]
name = "approve"
required-features = ["claude"]

[[example]]
name = "chat"
required-features = ["claude", "codex", "pi"]

[[example]]
name = "models"
required-features = ["claude", "codex", "pi"]

[[example]]
name = "observe"
required-features = ["claude", "codex"]

[[example]]
name = "permissions"
required-features = ["codex"]

[[example]]
name = "quickstart"
required-features = ["claude"]

[[example]]
name = "sessions"
required-features = ["claude", "codex", "pi"]

[[example]]
name = "usage"
required-features = ["claude", "codex"]

[[test]]
name = "contract"
required-features = ["claude", "codex", "pi"]
