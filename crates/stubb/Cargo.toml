[package]
name = "stubb"
version = "0.1.0-rc.1"
edition = "2024"
rust-version = "1.99.0"
license = "MIT"
repository = "https://github.com/spelvia/stubb"
readme = "../../README.md"
description = "A Rust library for embedding coding agents (Codex, Claude Code, Pi, and ACP agents) in your application"
keywords = ["agent", "codex", "claude", "acp", "llm"]
categories = ["api-bindings", "development-tools"]

[lib]
path = "src/lib.rs"

[dependencies]
agent-client-protocol = "5.3.0"
base64 = "0.22"
futures = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread"] }
