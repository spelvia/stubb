name: Maintenance task
description: Track CI, packaging, documentation, dependencies, or internal cleanup.
labels: [maintenance, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What needs attention, and why?
    validations:
      required: true
  - type: textarea
    id: work
    attributes:
      label: Proposed work
      description: Describe the change and what completion looks like.
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Optional context, dependencies, or related issues.
