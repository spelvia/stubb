name: "Work item"
description: "Track a feature, fix, or release requirement for Keel."
body:
  - type: markdown
    attributes:
      value: |
        Use one issue per reviewable piece of work. Assign the target release milestone
        and release label during triage, when applicable.
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: "What should change, and which providers are affected?"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Done when
      description: "List the observable behavior required to close this issue."
      placeholder: |
        - [ ] ...
        - [ ] Unsupported native cases are explicit.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: "Relevant deterministic tests and real keel-tester checks."
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: "Related issues or native limitations, if any."
