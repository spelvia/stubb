version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
    # Wait a week before proposing a new release, so a compromised or
    # withdrawn version has time to be caught.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      compatible-updates:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
    # Wait a week before proposing a new release, so a compromised or
    # withdrawn version has time to be caught.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: chore(ci)
