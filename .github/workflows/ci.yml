name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust stable
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Release PRs compare against a reachable release tag.
          fetch-depth: ${{ startsWith(github.head_ref, 'release/') && '0' || '1' }}
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        env:
          RUSTUP_TOOLCHAIN: stable
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Formatting
        run: cargo +stable fmt --all -- --check
      - name: Clippy
        run: cargo +stable clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Each provider on its own
        run: |
          cargo +stable clippy -p stubb --all-targets --locked --no-default-features -- -D warnings
          for feature in claude codex pi acp; do
            cargo +stable clippy -p stubb --all-targets --locked --no-default-features --features "$feature" -- -D warnings
          done
      - name: Build all targets
        run: cargo +stable build --workspace --all-targets --all-features --locked
      - name: Unit and integration tests
        run: cargo +stable test --workspace --all-targets --all-features --locked
      - name: Build rustdoc and run doctests
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo +stable doc --workspace --all-features --no-deps --locked
          cargo +stable test --workspace --all-features --doc --locked
      - name: Verify release package and notes
        if: startsWith(github.head_ref, 'release/')
        run: |
          version=$(cargo +stable metadata --no-deps --locked --format-version 1 | jq -er '.packages[] | select(.name == "stubb") | .version')
          test -s "docs/releases/$version.md"
          cargo +stable package -p stubb --locked
          package="stubb-$version"
          for file in README.md LICENSE THIRD_PARTY.md; do
            tar -xOf "target/package/$package.crate" "$package/$file" | cmp - "$file"
          done
      - name: Check release API compatibility
        if: startsWith(github.head_ref, 'release/')
        run: |
          if ! baseline=$(git describe --tags --abbrev=0 --match 'v[0-9]*'); then
            echo "::notice::No previous release tag to compare."
            exit 0
          fi
          cargo +stable install cargo-semver-checks --version 0.51.0 --locked
          cargo +stable semver-checks -p stubb --baseline-rev "$baseline"

  dependencies:
    name: Dependencies
    uses: ./.github/workflows/dependencies.yml # zizmor: ignore[self-repository]

  checks:
    name: Repository checks
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every commit, for the secrets scan.
          fetch-depth: 0
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-machete@0.9.2,cargo-sort@2.1.4,taplo@0.10.0,typos@1.52.2,zizmor@1.32.0
      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl --fail --silent --show-error --location --output gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum --check
          mkdir -p "$HOME/.local/bin"
          tar --extract --gzip --file gitleaks.tar.gz --directory "$HOME/.local/bin" gitleaks
          rm gitleaks.tar.gz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl --fail --silent --show-error --location --output actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  actionlint.tar.gz" | sha256sum --check
          tar --extract --gzip --file actionlint.tar.gz --directory "$HOME/.local/bin" actionlint
          rm actionlint.tar.gz
      - name: Secrets (every commit)
        run: gitleaks git --redact --no-banner
      - name: Spelling
        run: typos
      - name: TOML formatting
        run: taplo fmt --check
      - name: Cargo.toml order
        run: cargo-sort --workspace --check --no-format
      - name: Unused dependencies
        run: cargo-machete
      - name: GitHub Actions lint and security
        run: |
          actionlint
          zizmor --offline .github/
      - name: Links between files
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress './**/*.md'
          fail: true
