name: Release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check version and release notes
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[] | select(.manifest_path | endswith("/crates/stubb/Cargo.toml")) | .version')
          test "$GITHUB_REF_NAME" = "v$version"
          test -s "docs/releases/$version.md"
      - name: Require successful main CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          runs=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" -f branch=main -f event=push -f head_sha="$sha" -F per_page=1)
          jq -e '.workflow_runs[0].conclusion == "success"' <<< "$runs"

      - name: Verify minimum supported Rust
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          cargo +1.99.0 build --workspace --all-features --all-targets --locked
          cargo +1.99.0 test --workspace --all-features --all-targets --locked
          cargo +1.99.0 test --workspace --all-features --doc --locked

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # crates.io only accepts Trusted Publishing for crates that already exist.
      # The very first upload falls back to a one-time token; every later
      # release uses OIDC, with no workflow edits or secrets to maintain.
      - name: Choose crates.io credential
        id: mode
        env:
          BOOTSTRAP_TOKEN: ${{ secrets.CRATES_IO_FIRST_PUBLISH_TOKEN }}
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' -A 'stubb-release-workflow' https://crates.io/api/v1/crates/stubb)
          case "$status" in
            200) echo "first=false" >> "$GITHUB_OUTPUT" ;;
            404)
              if [ -z "$BOOTSTRAP_TOKEN" ]; then
                echo "::error::stubb is not on crates.io yet; set CRATES_IO_FIRST_PUBLISH_TOKEN in the release environment"
                exit 1
              fi
              echo "first=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::crates.io lookup returned HTTP $status"; exit 1 ;;
          esac
      - name: Authenticate with Trusted Publishing
        if: steps.mode.outputs.first == 'false'
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.mode.outputs.first == 'true' && secrets.CRATES_IO_FIRST_PUBLISH_TOKEN || steps.auth.outputs.token }}
        run: cargo publish --manifest-path crates/stubb/Cargo.toml --locked --registry crates-io

  announce:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          flags=()
          if [[ "$version" == *-* ]]; then flags+=(--prerelease --latest=false); fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Stubb $version" \
            --notes-file "docs/releases/$version.md" "${flags[@]}"
