# TOML formatting (taplo), checked by the pre-commit hook and CI. Keys keep
# their order: cargo-sort orders Cargo.toml's dependencies.
include = ["**/*.toml"]
exclude = ["target/**"]

[formatting]
align_entries = false
array_auto_collapse = true
array_auto_expand = true
column_width = 100
indent_string = "\t"
reorder_keys = false
